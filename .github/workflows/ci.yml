name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out code and runs tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit and integration tests. The database tests run the real migrations on PGlite.
      - run: pnpm test
      - run: pnpm --filter @agent-city/city build

  # The CrewAI crews (crews/*): each runs end to end with a scripted model, no API key.
  # --locked also fails when uv.lock is stale, which CrewAI AMP would reject.
  crews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        crew: [devlog, content, review]
    defaults:
      run:
        working-directory: crews/${{ matrix.crew }}
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
