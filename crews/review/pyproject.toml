[project]
name = "review_crew"
version = "0.1.0"
description = "Agent City REVIEW CREW: ParlayLab's weekly business review"
authors = [{ name = "Average Output Studios" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]>=1.15.27,<2",
]

[project.scripts]
review_crew = "review_crew.main:run"
run_crew = "review_crew.main:run"
train = "review_crew.main:train"
replay = "review_crew.main:replay"
test = "review_crew.main:test"
run_with_trigger = "review_crew.main:run_with_trigger"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
