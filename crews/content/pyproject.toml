[project]
name = "content_crew"
version = "0.1.0"
description = "Agent City CONTENT CREW: the week's CreatorOS content plan and posts"
authors = [{ name = "Average Output Studios" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]>=1.15.27,<2",
]

[project.scripts]
content_crew = "content_crew.main:run"
run_crew = "content_crew.main:run"
train = "content_crew.main:train"
replay = "content_crew.main:replay"
test = "content_crew.main:test"
run_with_trigger = "content_crew.main:run_with_trigger"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
